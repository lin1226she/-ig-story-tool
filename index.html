<!DOCTYPE html>
<html lang="zh-Hant">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>內容策略助手｜自媒體內容工具</title>

<style>

*{
  box-sizing:border-box;
}

html{
  scroll-behavior:smooth;
}

body{
  margin:0;
  font-family:-apple-system,BlinkMacSystemFont,"PingFang TC","Noto Sans TC",sans-serif;
  background:#fff9fa;
  color:#292929;
  padding-bottom:90px;
}

button,
input,
select,
textarea{
  font-family:inherit;
}

button{
  -webkit-tap-highlight-color:transparent;
}

body.modal-open{
  overflow:hidden;
}

.app{
  max-width:680px;
  margin:auto;
}

.topbar{
  padding:24px 20px 12px;
  display:flex;
  justify-content:space-between;
  align-items:center;
}

.logo{
  font-size:20px;
  font-weight:850;
}

.badge{
  font-size:12px;
  font-weight:750;
  color:#b9637a;
  background:#ffeaf0;
  padding:7px 11px;
  border-radius:999px;
}

.hero{
  padding:10px 20px 14px;
}

.hero h1{
  margin:0 0 10px;
  font-size:30px;
  line-height:1.3;
}

.hero p{
  margin:0;
  color:#858085;
  line-height:1.8;
  font-size:15px;
}

.section{
  padding:0 16px;
  margin-top:20px;
}

.section-title{
  font-size:18px;
  font-weight:850;
  margin:0 5px 12px;
}

.group-title{
  margin:22px 4px 10px;
  font-size:13px;
  color:#b36b80;
  font-weight:800;
  letter-spacing:.4px;
}

.card{
  background:#fff;
  border-radius:23px;
  padding:20px;
  margin-bottom:15px;
  box-shadow:0 8px 30px rgba(80,40,50,.055);
}

.mode-grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:11px;
}

.mode{
  width:100%;
  text-align:left;
  background:#fff;
  border:1px solid #eedfe3;
  border-radius:20px;
  padding:17px 14px;
  cursor:pointer;
  color:#292929;
}

.mode.active{
  background:#fff0f4;
  border-color:#dc96aa;
}

.mode-icon{
  font-size:23px;
  margin-bottom:8px;
}

.mode-title{
  font-size:16px;
  font-weight:850;
  margin-bottom:5px;
}

.mode-desc{
  font-size:12px;
  color:#8a8588;
  line-height:1.55;
}

.current-mode{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:10px;
  background:#fff0f4;
  border:1px solid #efd2da;
  border-radius:18px;
  padding:14px 16px;
  margin-bottom:15px;
}

.current-mode small{
  display:block;
  color:#a47a85;
  font-size:11px;
  margin-bottom:4px;
}

.current-mode strong{
  font-size:16px;
  color:#ad5d73;
}

.change-mode{
  border:none;
  background:#fff;
  color:#b45e76;
  border-radius:999px;
  padding:9px 13px;
  font-size:12px;
  font-weight:800;
  cursor:pointer;
}

.field-title{
  display:block;
  font-size:14px;
  font-weight:800;
  margin:18px 0 9px;
}

.field-title:first-child{
  margin-top:0;
}

.field-note{
  font-size:12px;
  color:#999;
  line-height:1.6;
  margin-top:6px;
}

input,
select,
textarea{
  width:100%;
  border:1px solid #ebdfe2;
  background:#fff;
  color:#333;
  border-radius:14px;
  padding:13px 14px;
  font-size:15px;
  outline:none;
}

input:focus,
select:focus,
textarea:focus{
  border-color:#d997aa;
}

textarea{
  min-height:110px;
  resize:vertical;
  line-height:1.65;
}

.chips{
  display:flex;
  flex-wrap:wrap;
  gap:8px;
}

.chip input{
  display:none;
}

.chip span{
  display:inline-block;
  background:#f8f4f5;
  border:1px solid transparent;
  border-radius:999px;
  padding:9px 12px;
  font-size:13px;
  cursor:pointer;
}

.chip input:checked + span{
  background:#ffe8ee;
  border-color:#dda0b0;
  color:#b45e75;
  font-weight:750;
}

.value-category-grid{
  display:flex;
  flex-wrap:wrap;
  gap:8px;
}

.value-cat{
  border:1px solid #eee1e4;
  background:#f9f5f6;
  border-radius:999px;
  padding:9px 13px;
  font-size:13px;
  color:#555;
  cursor:pointer;
}

.value-cat.active{
  background:#ffe8ee;
  border-color:#dda0b0;
  color:#b45e75;
  font-weight:800;
}

.special-box{
  padding:16px;
  background:#fff8fa;
  border:1px solid #f0dfe4;
  border-radius:18px;
}

.special-title{
  font-size:13px;
  font-weight:850;
  color:#b7657b;
  margin-bottom:12px;
}

.primary-btn{
  width:100%;
  border:none;
  border-radius:17px;
  background:#d77d96;
  color:#fff;
  padding:16px;
  font-size:16px;
  font-weight:850;
  cursor:pointer;
}

.secondary-btn{
  width:100%;
  border:none;
  border-radius:15px;
  background:#303030;
  color:#fff;
  padding:14px;
  font-size:15px;
  font-weight:800;
  cursor:pointer;
  margin-top:12px;
}

.outline-btn{
  width:100%;
  border:1px solid #e5c7cf;
  border-radius:15px;
  background:#fff;
  color:#ad6176;
  padding:13px;
  font-size:14px;
  font-weight:750;
  cursor:pointer;
  margin-top:9px;
}

.save-btn{
  width:100%;
  border:1px solid #e4bdc8;
  border-radius:15px;
  background:#fff5f8;
  color:#ad5c73;
  padding:14px;
  font-size:14px;
  font-weight:800;
  cursor:pointer;
  margin-top:17px;
}

.success{
  display:none;
  text-align:center;
  color:#a65b70;
  font-size:13px;
  margin-top:10px;
}

.result-success{
  text-align:center;
  padding:12px 5px 7px;
}

.result-icon{
  width:55px;
  height:55px;
  margin:0 auto 13px;
  border-radius:50%;
  background:#ffe8ee;
  color:#b55f77;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:24px;
  font-weight:800;
}

.result-success h3{
  margin:0 0 8px;
  font-size:20px;
}

.result-success p{
  margin:0;
  font-size:13px;
  color:#888;
  line-height:1.7;
}

#resultCard{
  display:none;
}

#fullPromptWrap{
  display:none;
  margin-top:14px;
}

#result{
  white-space:pre-wrap;
  background:#faf6f7;
  border-radius:16px;
  padding:16px;
  font-size:13px;
  line-height:1.8;
  max-height:520px;
  overflow-y:auto;
}

.page{
  display:none;
}

.page.active{
  display:block;
}

.tool-form{
  display:none;
}

.tool-form.active{
  display:block;
}

.hidden{
  display:none !important;
}

/* Modal */

.modal-overlay{
  position:fixed;
  inset:0;
  background:rgba(40,30,34,.28);
  z-index:300;
  display:none;
  align-items:flex-end;
  justify-content:center;
}

.modal-overlay.active{
  display:flex;
}

.mode-sheet{
  width:100%;
  max-width:680px;
  background:#fff;
  border-radius:28px 28px 0 0;
  padding:12px 18px 28px;
  max-height:82vh;
  overflow-y:auto;
}

.sheet-handle{
  width:42px;
  height:5px;
  border-radius:999px;
  background:#ded7da;
  margin:0 auto 18px;
}

.sheet-header{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:15px;
}

.sheet-header h3{
  margin:0;
  font-size:20px;
}

.sheet-close{
  width:35px;
  height:35px;
  border:none;
  background:#f6f2f3;
  border-radius:50%;
  font-size:18px;
  cursor:pointer;
}

.sheet-grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
}

.sheet-option{
  border:1px solid #eee1e4;
  border-radius:18px;
  padding:15px 13px;
  background:#fff;
  text-align:left;
  cursor:pointer;
  color:#292929;
}

.sheet-option.active{
  background:#fff0f4;
  border-color:#db97aa;
}

.sheet-icon{
  font-size:22px;
  margin-bottom:7px;
}

.sheet-title{
  font-size:15px;
  font-weight:850;
  margin-bottom:4px;
}

.sheet-desc{
  color:#8d878a;
  font-size:11px;
  line-height:1.45;
}

/* Bottom */

.bottom-nav{
  position:fixed;
  bottom:0;
  left:0;
  right:0;
  height:78px;
  z-index:100;
  background:rgba(255,255,255,.96);
  border-top:1px solid #f0e4e7;
  backdrop-filter:blur(14px);
  display:flex;
  justify-content:center;
}

.bottom-inner{
  max-width:680px;
  width:100%;
  display:flex;
}

.nav-item{
  flex:1;
  border:none;
  background:transparent;
  color:#9a9698;
  font-size:11px;
  cursor:pointer;
}

.nav-icon{
  display:block;
  font-size:20px;
  margin-bottom:4px;
}

.nav-item.active{
  color:#be6c82;
  font-weight:850;
}

</style>

</head>

<body>


<div class="app">


<div class="topbar">

  <div class="logo">
    內容策略助手 ♡
  </div>

  <div class="badge">
    自媒體工具
  </div>

</div>


<!-- 首頁 -->

<div id="home" class="page active">


  <div class="hero">

    <h1>
      今天不用再想<br>
      到底要發什麼。
    </h1>

    <p>
      依照你現在要做的內容，直接選一個工具開始。
    </p>

  </div>


  <div class="section">


    <div class="group-title">
      限時動態
    </div>

    <div class="mode-grid">

      <button class="mode active" data-mode="story" onclick="selectHomeMode(this)">

        <div class="mode-icon">
          📱
        </div>

        <div class="mode-title">
          今日限動排程
        </div>

        <div class="mode-desc">
          把生活、互動、觀點、產品排成一整天
        </div>

      </button>


      <button class="mode" data-mode="productstory" onclick="selectHomeMode(this)">

        <div class="mode-icon">
          🛍️
        </div>

        <div class="mode-title">
          產品限動起承轉合
        </div>

        <div class="mode-desc">
          專門規劃一組產品銷售限動
        </div>

      </button>

    </div>


    <div class="group-title">
      個人品牌
    </div>

    <div class="mode-grid">

      <button class="mode" data-mode="values" onclick="selectHomeMode(this)">

        <div class="mode-icon">
          💭
        </div>

        <div class="mode-title">
          價值觀／想法
        </div>

        <div class="mode-desc">
          把腦中的觀念整理成有共鳴的內容
        </div>

      </button>

    </div>


    <div class="group-title">
      流量內容
    </div>

    <div class="mode-grid">

      <button class="mode" data-mode="reels" onclick="selectHomeMode(this)">

        <div class="mode-icon">
          🎬
        </div>

        <div class="mode-title">
          Reels 爆款腳本
        </div>

        <div class="mode-desc">
          爆點、鉤子、節奏、腳本、CTA
        </div>

      </button>


      <button class="mode" data-mode="threads" onclick="selectHomeMode(this)">

        <div class="mode-icon">
          ✏️
        </div>

        <div class="mode-title">
          Threads
        </div>

        <div class="mode-desc">
          找切角、開頭、共鳴與討論點
        </div>

      </button>

    </div>


    <div class="group-title">
      整體規劃
    </div>

    <div class="mode-grid">

      <button class="mode" data-mode="week" onclick="selectHomeMode(this)">

        <div class="mode-icon">
          🗓️
        </div>

        <div class="mode-title">
          7 天內容規劃
        </div>

        <div class="mode-desc">
          限動、Reels、Threads 或全平台排程
        </div>

      </button>

    </div>


  </div>


</div>


<!-- 今日內容 -->

<div id="today" class="page">


  <div class="hero">

    <h1 id="todayTitle">
      今天的限動<br>
      怎麼排比較順？
    </h1>

    <p id="todaySubtitle">
      把今天手上的內容丟進來，幫你排成一整天。
    </p>

  </div>


  <div class="section">


    <div class="current-mode">

      <div>

        <small>
          目前工具
        </small>

        <strong id="currentModeText">
          今日限動排程
        </strong>

      </div>

      <button class="change-mode" onclick="openModeModal()">
        換工具
      </button>

    </div>


    <!-- 今日限動排程 -->

    <div id="form-story" class="tool-form active">

      <div class="card">

        <div class="special-box">

          <div class="special-title">
            📱 今天整天的限動
          </div>


          <label class="field-title">
            今天有哪些事情可以發？
          </label>

          <textarea
            id="storyLife"
            placeholder="例如：早上送小孩、吃早餐、下午去買東西、晚上在家陪小孩。"></textarea>


          <label class="field-title">
            今天有沒有想分享的觀點／小知識？
          </label>

          <textarea
            id="storyIdea"
            placeholder="例如：最近很有感的一個育兒想法、飲食小知識。沒有可以空白。"></textarea>


          <label class="field-title">
            今天想帶什麼產品？
          </label>

          <input
            id="storyProduct"
            placeholder="例如：益生菌、可可、水光錠。">


          <label class="field-title">
            今天產品想怎麼出現？
          </label>

          <select id="storyProductStyle">

            <option>
              AI 幫我判斷
            </option>

            <option>
              輕輕露出就好
            </option>

            <option>
              日常使用情境
            </option>

            <option>
              分享小知識後帶到
            </option>

            <option>
              建立需求
            </option>

            <option>
              引導詢問
            </option>

            <option>
              今天有活動，要明確銷售
            </option>

          </select>


          <label class="field-title">
            今天要不要安排互動？
          </label>

          <select id="storyInteraction">

            <option>
              AI 幫我判斷
            </option>

            <option>
              不用
            </option>

            <option>
              投票
            </option>

            <option>
              問答
            </option>

            <option>
              滑桿
            </option>

            <option>
              表情回覆
            </option>

          </select>


          <label class="field-title">
            今天想發幾則？
          </label>

          <select id="storyCount">

            <option value="3">
              3 則
            </option>

            <option value="4">
              4 則
            </option>

            <option value="5" selected>
              5 則
            </option>

            <option value="6">
              6 則
            </option>

            <option value="7">
              7 則
            </option>

          </select>


          <label class="field-title">
            今天手上的素材
          </label>

          <div class="chips">

            <label class="chip">
              <input type="checkbox" name="storyMaterial" value="自拍">
              <span>自拍</span>
            </label>

            <label class="chip">
              <input type="checkbox" name="storyMaterial" value="生活照片">
              <span>生活照片</span>
            </label>

            <label class="chip">
              <input type="checkbox" name="storyMaterial" value="生活影片">
              <span>生活影片</span>
            </label>

            <label class="chip">
              <input type="checkbox" name="storyMaterial" value="產品照片">
              <span>產品照片</span>
            </label>

            <label class="chip">
              <input type="checkbox" name="storyMaterial" value="料理">
              <span>料理</span>
            </label>

            <label class="chip">
              <input type="checkbox" name="storyMaterial" value="親子素材">
              <span>親子素材</span>
            </label>

            <label class="chip">
              <input type="checkbox" name="storyMaterial" value="只有文字">
              <span>只有文字</span>
            </label>

          </div>

        </div>

      </div>

    </div>


    <!-- 產品限動 -->

    <div id="form-productstory" class="tool-form">

      <div class="card">

        <div class="special-box">

          <div class="special-title">
            🛍️ 一組產品限動
          </div>


          <label class="field-title">
            今天想分享什麼產品？
          </label>

          <input
            id="productStoryProduct"
            placeholder="例如：益生菌">


          <label class="field-title">
            今天有沒有可以當開場的生活情境？
          </label>

          <textarea
            id="productStorySituation"
            placeholder="例如：小孩最近外食比較多、早上準備保健品。沒有也可以空白。"></textarea>


          <label class="field-title">
            這組限動主要目標
          </label>

          <select id="productStoryGoal">

            <option>
              輕曝光
            </option>

            <option>
              建立需求
            </option>

            <option>
              分享使用感受
            </option>

            <option>
              增加信任
            </option>

            <option>
              引導私訊詢問
            </option>

            <option>
              活動轉單
            </option>

          </select>


          <label class="field-title">
            想做幾則？
          </label>

          <select id="productStoryCount">

            <option>
              1 則
            </option>

            <option>
              2 則
            </option>

            <option selected>
              3 則
            </option>

            <option>
              4 則
            </option>

            <option>
              5 則
            </option>

            <option>
              6 則
            </option>

            <option>
              7 則
            </option>

          </select>


          <label class="field-title">
            你手上有什麼素材？
          </label>

          <div class="chips">

            <label class="chip">
              <input type="checkbox" name="productMaterial" value="產品本人照">
              <span>產品本人照</span>
            </label>

            <label class="chip">
              <input type="checkbox" name="productMaterial" value="使用中的畫面">
              <span>使用畫面</span>
            </label>

            <label class="chip">
              <input type="checkbox" name="productMaterial" value="生活情境照">
              <span>生活情境</span>
            </label>

            <label class="chip">
              <input type="checkbox" name="productMaterial" value="成分圖">
              <span>成分圖</span>
            </label>

            <label class="chip">
              <input type="checkbox" name="productMaterial" value="對話截圖">
              <span>對話截圖</span>
            </label>

            <label class="chip">
              <input type="checkbox" name="productMaterial" value="只有文字">
              <span>只有文字</span>
            </label>

          </div>

        </div>

      </div>

    </div>


    <!-- 價值觀 -->

    <div id="form-values" class="tool-form">

      <div class="card">

        <div class="special-box">

          <div class="special-title">
            💭 把你的觀念整理成內容
          </div>


          <label class="field-title">
            這次想聊哪一類？
          </label>

          <div class="value-category-grid">

            <button type="button" class="value-cat active" data-value-cat="育兒" onclick="selectValueCategory(this)">育兒</button>

            <button type="button" class="value-cat" data-value-cat="愛情／伴侶" onclick="selectValueCategory(this)">愛情／伴侶</button>

            <button type="button" class="value-cat" data-value-cat="婚姻／家庭" onclick="selectValueCategory(this)">婚姻／家庭</button>

            <button type="button" class="value-cat" data-value-cat="媽媽自己" onclick="selectValueCategory(this)">媽媽自己</button>

            <button type="button" class="value-cat" data-value-cat="金錢觀" onclick="selectValueCategory(this)">金錢觀</button>

            <button type="button" class="value-cat" data-value-cat="工作／事業" onclick="selectValueCategory(this)">工作／事業</button>

            <button type="button" class="value-cat" data-value-cat="人際關係" onclick="selectValueCategory(this)">人際關係</button>

            <button type="button" class="value-cat" data-value-cat="成長／人生" onclick="selectValueCategory(this)">成長／人生</button>

            <button type="button" class="value-cat" data-value-cat="減脂／體態" onclick="selectValueCategory(this)">減脂／體態</button>

function showPage(pageId){

  document.querySelectorAll(".page")
    .forEach(page=>page.classList.remove("active"));


  document.getElementById(pageId)
    .classList.add("active");


  document.querySelectorAll(".nav-item")
    .forEach(item=>item.classList.remove("active"));


  if(pageId==="home"){

    document.getElementById("navHome")
      .classList.add("active");

  }


  if(pageId==="today"){

    document.getElementById("navToday")
      .classList.add("active");

  }


  if(pageId==="profile"){

    document.getElementById("navProfile")
      .classList.add("active");

  }


  window.scrollTo({
    top:0,
    behavior:"smooth"
  });

}


function selectHomeMode(element){

  selectedMode=
    element.getAttribute("data-mode");


  document.querySelectorAll(".mode")
    .forEach(item=>item.classList.remove("active"));


  element.classList.add("active");


  updateModeUI();

  updateSheetActive();

  showPage("today");

}


function changeMode(mode){

  selectedMode=mode;


  updateModeUI();

  updateSheetActive();

  updateHomeActive();

  closeModeModal();


  document.getElementById("resultCard")
    .style.display="none";


  window.scrollTo({
    top:0,
    behavior:"smooth"
  });

}


function updateModeUI(){

  document.getElementById("currentModeText")
    .textContent=
    modeNames[selectedMode];


  document.getElementById("todayTitle")
    .innerHTML=
    pageTexts[selectedMode].title;


  document.getElementById("todaySubtitle")
    .textContent=
    pageTexts[selectedMode].subtitle;


  document.querySelectorAll(".tool-form")
    .forEach(form=>form.classList.remove("active"));


  document.getElementById(
    "form-"+selectedMode
  ).classList.add("active");

}


function updateHomeActive(){

  document.querySelectorAll(".mode")
    .forEach(item=>{

      if(
        item.getAttribute("data-mode")
        ===
        selectedMode
      ){

        item.classList.add("active");

      }

      else{

        item.classList.remove("active");

      }

    });

}


function openModeModal(){

  updateSheetActive();


  document.getElementById("modeModal")
    .classList.add("active");


  document.body.classList.add("modal-open");

}


function closeModeModal(){

  document.getElementById("modeModal")
    .classList.remove("active");


  document.body.classList.remove("modal-open");

}


function overlayClose(event){

  if(event.target.id==="modeModal"){

    closeModeModal();

  }

}


function updateSheetActive(){

  document.querySelectorAll(".sheet-option")
    .forEach(item=>{

      if(
        item.getAttribute("data-sheet-mode")
        ===
        selectedMode
      ){

        item.classList.add("active");

      }

      else{

        item.classList.remove("active");

      }

    });

}


function selectValueCategory(button){

  selectedValueCategory=
    button.getAttribute("data-value-cat");


  document.querySelectorAll(".value-cat")
    .forEach(item=>item.classList.remove("active"));


  button.classList.add("active");


  updateValueAngles();

}


function updateValueAngles(){

  const select=
    document.getElementById("valueAngle");


  const angles=
    valueAngles[selectedValueCategory]
    || valueAngles["其他"];


  select.innerHTML="";


  angles.forEach(angle=>{

    const option=
      document.createElement("option");


    option.value=angle;

    option.textContent=angle;


    select.appendChild(option);

  });

}

    topics:

function loadProfile(){

  const saved=
    localStorage.getItem("creatorAIProfile");


  if(!saved){

    return;

  }


  try{

    const p=
      JSON.parse(saved);


    document.getElementById("accountType").value=
      p.accountType||"";


    document.getElementById("audience").value=
      p.audience||"";


    document.getElementById("topics").value=
      p.topics||"";


    document.getElementById("tone").value=
      p.tone||"";


    document.getElementById("avoid").value=
      p.avoid||"";


    document.getElementById("products").value=
      p.products||"";

  }

  catch{}

}


function getProfile(){

  try{

    return JSON.parse(
      localStorage.getItem("creatorAIProfile")
      || "{}"
    );

  }

  catch{

    return {};

  }

}


function getChecked(name){

  const items=
    Array.from(
      document.querySelectorAll(
        `input[name="${name}"]:checked`
      )
    );


  if(items.length===0){

    return "沒有特別素材";

  }


  return items
    .map(x=>x.value)
    .join("、");

}

    prompt=buildProductStoryPrompt();

  }


  if(selectedMode==="values"){

    if(
      document.getElementById("valueCore").value.trim()===""
    ){

      alert("先寫下你真正想講的那句話 ♡");

      return;

    }


    prompt=buildValuesPrompt();

  }


  if(selectedMode==="reels"){

    if(
      document.getElementById("reelsTopic").value.trim()===""
    ){

      alert("先寫一下這支 Reels 想拍什麼題材 ♡");

      return;

    }


    prompt=buildReelsPrompt();

  }


  if(selectedMode==="threads"){

    if(
      document.getElementById("threadsTopic").value.trim()===""
    ){

      alert("先寫一下最近有什麼想講的 ♡");

      return;

    }


    prompt=buildThreadsPrompt();

  }


  if(selectedMode==="week"){

    prompt=buildWeekPrompt();

  }


  document.getElementById("result")
    .textContent=prompt;


  document.getElementById("resultDescription")
    .textContent=
    `已產生「${modeNames[selectedMode]}」專屬指令。`;


  document.getElementById("resultCard")
    .style.display="block";


  document.getElementById("fullPromptWrap")
    .style.display="none";


  document.getElementById("viewPromptBtn")
    .textContent="查看完整指令";


  document.getElementById("resultCard")
    .scrollIntoView({
      behavior:"smooth",
      block:"start"
    });

}


function togglePrompt(){

  const wrap=
    document.getElementById("fullPromptWrap");


  const btn=
    document.getElementById("viewPromptBtn");


  if(wrap.style.display==="block"){

    wrap.style.display="none";

    btn.textContent="查看完整指令";

  }

  else{

    wrap.style.display="block";

    btn.textContent="收起完整指令";

  }

}


function copyPrompt(){

  const text=
    document.getElementById("result").textContent;


  if(!text){

    return;

  }


  navigator.clipboard
    .writeText(text)
    .then(showCopySuccess)
    .catch(fallbackCopy);

}


function fallbackCopy(){

  const text=
    document.getElementById("result").textContent;


  const textarea=
    document.createElement("textarea");


  textarea.value=text;

  textarea.style.position="fixed";

  textarea.style.opacity="0";


  document.body.appendChild(textarea);


  textarea.select();


  document.execCommand("copy");


  document.body.removeChild(textarea);


  showCopySuccess();

}


function showCopySuccess(){

  const success=
    document.getElementById("copySuccess");


  success.style.display="block";


  setTimeout(()=>{

    success.style.display="none";

  },2000);

}


loadProfile();

updateValueAngles();

updateModeUI();

updateSheetActive();

updateCTAUI();

updateWeekUI();


</script>
